#######################################################################################
# Hyprland Configuration (optimized, fully-documented)
# Based on your original configuration; rewritten and reorganized for clarity
# Hyprland version: compatible with Hyprland >= v0.40
# Style: indented blocks, full English comments, logical ordering
#######################################################################################

# -----------------------------------------------------------------------------
# Header & metadata
# -----------------------------------------------------------------------------
autogenerated = 0
$mainMod = SUPER

# -----------------------------------------------------------------------------
# Appearance and decorations (general visual settings)
# -----------------------------------------------------------------------------
general {
    # Border colors for focused / unfocused windows
    col.active_border = 0xff89b4fa
    col.inactive_border = 0xff313244

    # Inner and outer gaps (px)
    gaps_in = 6
    gaps_out = 6

    # Window border thickness (px)
    border_size = 2

    # Behavior
    resize_on_border = false
    allow_tearing = false

    # Default tiling layout
    layout = dwindle
}

# Window decoration settings (rounded corners, opacity, shadows)
decoration {
    rounding = 10
    rounding_power = 6

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# -----------------------------------------------------------------------------
# Monitors & XWayland
# -----------------------------------------------------------------------------
# Define monitors here. Use names reported by `hyprctl monitors`.
monitor = DP-3, 1920x1080@144, 0x0, 1

# XWayland-specific options
xwayland {
    # Prevents zero-scaling issues for XWayland clients
    force_zero_scaling = true
}

# -----------------------------------------------------------------------------
# Environment variables / application shortcuts
# -----------------------------------------------------------------------------
# Common application command aliases used by keybindings and autostart
$terminal = xfce4-terminal
$fileManager = thunar
$menu = rofi -show drun

# Sandboxed application wrappers (firejail profiles)
$telegram = firejail --profile=$HOME/.config/firejail/telegram.profile telegram-desktop
$chromium = firejail --profile=$HOME/.config/firejail/browser.profile chromium-browser %U
$discord = ELECTRON_OZONE_PLATFORM_HINT=wayland firejail --profile=$HOME/.config/firejail/browser.profile discord
$keet = ELECTRON_OZONE_PLATFORM_HINT=wayland firejail --profile=$HOME/.config/firejail/browser.profile keet

# Runtime environment variables for cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# -----------------------------------------------------------------------------
# Input devices and keyboard configuration
# -----------------------------------------------------------------------------
input {
    # Keyboard layout and options
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = compose:ralt
    kb_rules =

    # Pointer behavior
    follow_mouse = 1
    sensitivity = 0

    # Touchpad options
    touchpad {
        natural_scroll = false
    }
}

# Per-device overrides can go outside the input block
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



# -----------------------------------------------------------------------------
# Animations (timing and easing functions)
# -----------------------------------------------------------------------------
animations {
    enabled = true

    # Predefined cubic-bezier functions for use by animations
    bezier = easeOutQuint, 0.23,1,0.32,1
    bezier = easeInOutCubic, 0.65,0.05,0.36,1
    bezier = linear, 0,0,1,1
    bezier = almostLinear, 0.5,0.5,0.75,1.0
    bezier = quick, 0.15,0,0.1,1

    # Animation definitions: name, enabled, duration-ish, easing, optional modifier
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# -----------------------------------------------------------------------------
# Layouts
# -----------------------------------------------------------------------------
# Dwindle layout is the main tiling algorithm used
dwindle {
    pseudotile = true
    preserve_split = true
}

# Master layout configuration (optional/auxiliary)
master {
    new_status = master
}

# -----------------------------------------------------------------------------
# Keybindings and mouse bindings
# -----------------------------------------------------------------------------
# Screenshot helpers (grim + slurp + wl-copy)
# Full screen -> clipboard
bind = CTRL, F12, exec, grim - | wl-copy

# Full screen -> file
bind = CTRL_SHIFT, F12, exec, grim ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png

# Select area -> clipboard
bind = SUPER, F12, exec, grim -g "$(slurp)" - | wl-copy

# Select area -> file
bind = SHIFT, F12, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png

# Active window -> clipboard (uses hyprctl to extract geometry)
bind = CTRL_SUPER, F12, exec, sh -c "geom=\$(hyprctl activewindow -j | tr -d ' \n' | sed -E 's/.*\"at\":\\[(-?[0-9]+),(-?[0-9]+)\\].*\"size\":\\[([0-9]+),([0-9]+)\\].*/\\1,\\2 \\3x\\4/'); [ -n \"\$geom\" ] && grim -g \"\$geom\" - | wl-copy"

# Active window -> file
bind = SUPER_SHIFT, F12, exec, sh -c "geom=\$(hyprctl activewindow -j | tr -d ' \n' | sed -E 's/.*\"at\":\\[(-?[0-9]+),(-?[0-9]+)\\].*\"size\":\\[([0-9]+),([0-9]+)\\].*/\\1,\\2 \\3x\\4/'); [ -n \"\$geom\" ] && grim -g \"\$geom\" ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"

# Application shortcuts (modifiers + single-key)
bind = $mainMod SHIFT, T, exec, $telegram
bind = $mainMod SHIFT, B, exec, $chromium
bind = $mainMod SHIFT, D, exec, $discord
bind = $mainMod SHIFT, S, exec, steam
bind = $mainMod SHIFT, K, exec, $keet
bind = $mainMod SHIFT, G, exec, gimp
bind = $mainMod SHIFT, I, exec, inkscape

# Kill application shortcuts
bind = $mainMod CTRL, S, exec, killall steam
bind = $mainMod CTRL, D, exec, killall discord
bind = $mainMod CTRL, T, exec, killall telegram-desktop
bind = $mainMod CTRL, K, exec, pkill -3 pear-runtime

# Window management and launcher
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, W, pseudo,
bind = $mainMod, F, fullscreen
bind = $mainMod, E, togglesplit,

# Focus movement by direction
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows by direction
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces (switch and move-to workspace)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces with mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings for move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio controls (PulseAudio / PipeWire compatible)
bind = $mainMod SHIFT, M, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod SHIFT, Prior, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = $mainMod SHIFT, Next, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = $mainMod SHIFT, P, exec, xfce4-terminal -e pulsemixer

# Legacy multimedia key bindings using wpctl/playerctl
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness keys
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media keys (playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# -----------------------------------------------------------------------------
# Autostart applications
# -----------------------------------------------------------------------------
# Use exec-once to avoid duplicate startups when reloading Hyprland
exec-once = hyprpaper &
exec-once = sleep 0.3 && waybar &
exec-once = sleep 0.5 && hyprctl reload
exec-once = thunar --daemon

# -----------------------------------------------------------------------------
# Permissions (screencopy, portals, plugins)
# -----------------------------------------------------------------------------
# Grant specific binaries permission for screencopy / plugin access
permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# -----------------------------------------------------------------------------
# Window & Workspace rules (organized and documented)
# -----------------------------------------------------------------------------
# Global rules: general safety and behavior
windowrule = suppressevent maximize, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# ------------------------------
# Standard pattern for modal dialogs (float, center, pin, stayfocused)
# Applies to: XDG Portal, File pickers, Settings, and generic dialogs
# ------------------------------
$DIALOG_CLASSES = ^(xdg-desktop-portal-gtk|polkit-gnome-authentication-agent-1|lxpolkit|polkit-kde-authentication-agent-1|org.kde.polkit-kde-authentication-agent-1|qalculate-gtk|gnome-calculator|mate-calc|copyq|clipman)$
$DIALOG_TITLES = ^(Open|Save|Select|Choose File|.*Settings|.*Configuration|.*Preferences|.*Options|.*Properties|.*File Chooser|Select File|Browse Files|Run Command|About)(.*)$

# Rules for dialog classes
windowrulev2 = float, class:$DIALOG_CLASSES
windowrulev2 = center, class:$DIALOG_CLASSES
windowrulev2 = stayfocused, class:$DIALOG_CLASSES

# Rules for dialog titles
windowrulev2 = float, title:$DIALOG_TITLES
windowrulev2 = center, title:$DIALOG_TITLES
windowrulev2 = stayfocused, title:$DIALOG_TITLES

# Default size for file pickers and XDG portal
windowrulev2 = size 60% 70%, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = minsize 800 600, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 60% 70%, title:^(Open|Save|Select|Choose File|.*File Chooser|Select File|Browse Files)(.*)$
windowrulev2 = minsize 800 600, title:^(Open|Save|Select|Choose File)(.*)$

# ------------------------------
# Dolphin Emulator (dolphin-emu) specific rules
# File dialogs, settings and Vulkan config windows
# ------------------------------
$DOLPHIN_DIALOGS = ^(Open|Save|Select|.*Configuration|.*Settings|Controller|Graphics|Properties|Vulkan Graphics Configuration)(.*)$

windowrulev2 = float, class:^(dolphin-emu)$, title:$DOLPHIN_DIALOGS
windowrulev2 = center, class:^(dolphin-emu)$, title:$DOLPHIN_DIALOGS
windowrulev2 = stayfocused, class:^(dolphin-emu)$, title:$DOLPHIN_DIALOGS

# Specific size for Dolphin file dialogs
windowrulev2 = size 60% 70%, class:^(dolphin-emu)$, title:^(Open|Save|Select)(.*)$
windowrulev2 = minsize 800 600, class:^(dolphin-emu)$, title:^(Open|Save|Select)(.*)$

# ------------------------------
# Kdenlive video editor rules
# Project dialogs, render and tool windows
# ------------------------------
$KDENLIVE_CLASS = ^(kdenlive|org.kde.kdenlive)$
$KDENLIVE_PROJECT = ^(Open Project|Save Project|Open)(.*)$
$KDENLIVE_RENDER = ^(Render|Render Project|Export|Export Project|Render File)(.*)$
$KDENLIVE_TOOLS = ^(Effects|Transitions|Titler|Monitor|Clip Properties|Project Bin)(.*)$

# Base rules (applied to all Kdenlive dialogs)
windowrulev2 = float, class:$KDENLIVE_CLASS, title:$KDENLIVE_PROJECT
windowrulev2 = float, class:$KDENLIVE_CLASS, title:$KDENLIVE_RENDER
windowrulev2 = float, class:$KDENLIVE_CLASS, title:$KDENLIVE_TOOLS
windowrulev2 = center, class:$KDENLIVE_CLASS, title:$KDENLIVE_PROJECT
windowrulev2 = center, class:$KDENLIVE_CLASS, title:$KDENLIVE_RENDER
windowrulev2 = center, class:$KDENLIVE_CLASS, title:$KDENLIVE_TOOLS
windowrulev2 = stayfocused, class:$KDENLIVE_CLASS, title:$KDENLIVE_PROJECT
windowrulev2 = stayfocused, class:$KDENLIVE_CLASS, title:$KDENLIVE_RENDER
windowrulev2 = stayfocused, class:$KDENLIVE_CLASS, title:$KDENLIVE_TOOLS

# Specific sizes
windowrulev2 = size 65% 75%, class:$KDENLIVE_CLASS, title:$KDENLIVE_PROJECT
windowrulev2 = size 80% 80%, class:$KDENLIVE_CLASS, title:$KDENLIVE_RENDER
windowrulev2 = minsize 1000 700, class:$KDENLIVE_CLASS, title:$KDENLIVE_RENDER
windowrulev2 = size 60% 70%, class:$KDENLIVE_CLASS, title:$KDENLIVE_TOOLS

# Fallback for empty Kdenlive windows
windowrulev2 = float, class:^(kdenlive)$, title:^$
windowrulev2 = center, class:^(kdenlive)$, title:^$
windowrulev2 = size 65% 75%, class:^(kdenlive)$, title:^$
windowrulev2 = stayfocused, class:^(kdenlive)$, title:^$

# ------------------------------
# Thunar (File Manager)
# Rename, replace and conflict dialogs
# ------------------------------
$THUNAR_DIALOGS = ^(Rename|Replace|File Exists|Confirm)(.*)$

windowrulev2 = float, class:^(thunar)$, title:$THUNAR_DIALOGS
windowrulev2 = center, class:^(thunar)$, title:$THUNAR_DIALOGS
windowrulev2 = stayfocused, class:^(thunar)$, title:$THUNAR_DIALOGS
windowrulev2 = size 15% 15%, class:^(thunar)$, title:$THUNAR_DIALOGS
windowrulev2 = minsize 150 150, class:^(thunar)$, title:$THUNAR_DIALOGS

# ------------------------------
# Fallback defaults for anonymous floating windows
# ------------------------------
windowrulev2 = float, class:^$, floating:1
windowrulev2 = center, class:^$, floating:1
windowrulev2 = size 50% 60%, class:^$, floating:1
windowrulev2 = stayfocused, class:^$, floating:1


# -----------------------------------------------------------------------------
# Workspace assignments for common applications (workspace rules)
# These send matching classes to specific workspaces for predictable layout
# -----------------------------------------------------------------------------
# Browsers
windowrulev2 = workspace 1, class:^(librewolf)$
windowrulev2 = workspace 1, class:^(chromium-browser)$

# Messengers and communication (Telegram, Discord, etc.)
windowrulev2 = workspace 2, class:^(org.telegram.desktop)$
windowrulev2 = workspace 2, class:^(pear-runtime)$
windowrulev2 = workspace 2, class:^(forkgram)$
windowrulev2 = workspace 2, class:^(discord)$

# Code editors
windowrulev2 = workspace 3, class:^(codium)$

# PDF readers
windowrulev2 = workspace 4, class:^(org.kde.okular)$

# Image editors
windowrulev2 = workspace 5, class:^(gimp)$
windowrulev2 = workspace 5, class:^(krita)$
windowrulev2 = workspace 5, class:^(org.inkscape.Inkscape)$

# Video editors
windowrulev2 = workspace 6, class:^(org.kde.kdenlive)$

# Game platforms
windowrulev2 = workspace 8, class:^(steamwebhelper)$
windowrulev2 = workspace 8, class:^(steam)$
windowrulev2 = workspace 8, class:^(heroic)$

# Games (specific Steam apps)
windowrulev2 = workspace 9, class:^(steam_app_0)$
