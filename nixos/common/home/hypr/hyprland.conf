#######################################################################################
# hyprland configuration
# reference: https://wiki.hyprland.org/configuring/
#######################################################################################

autogenerated = 0
$mainMod = SUPER

#######################################################################################
# monitors
#######################################################################################

monitor = DP-3, 1920x1080@144, 0x0, 1

xwayland {
  force_zero_scaling = true
}

#######################################################################################
# applications
#######################################################################################

$terminal = xfce4-terminal
$fileManager = thunar
$menu = rofi -show drun

# sandboxed applications
$telegram = firejail --profile=$HOME/.config/firejail/telegram.profile telegram-desktop 
$chromium = firejail --profile=$HOME/.config/firejail/browser.profile chromium-browser %U
$discord = ELECTRON_OZONE_PLATFORM_HINT=wayland firejail --profile=/home/ratoncio/.config/firejail/browser.profile  discord
$keet = ELECTRON_OZONE_PLATFORM_HINT=wayland firejail --profile=/home/ratoncio/.config/firejail/browser.profile keet 

#######################################################################################
# autostart
#######################################################################################

exec-once = hyprpaper &
exec-once = sleep 0.3 && waybar &
exec-once = sleep 0.5 && hyprctl reload
exec-once = thunar --daemon

#######################################################################################
# environment variables
#######################################################################################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#######################################################################################
# permissions
#######################################################################################

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#######################################################################################
# appearance
#######################################################################################

# ==============================
# general
# ==============================

general {
    col.active_border = 0xff89b4fa
    col.inactive_border = 0xff313244

    gaps_in = 6
    gaps_out = 6
    border_size = 2

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# ==============================
# decorations
# ==============================

decoration {
    rounding = 10
    rounding_power = 6

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# ==============================
# animations
# ==============================


animations {
    enabled = true

    bezier = easeOutQuint, 0.23,1,0.32,1
    bezier = easeInOutCubic, 0.65,0.05,0.36,1
    bezier = linear, 0,0,1,1
    bezier = almostLinear, 0.5,0.5,0.75,1.0
    bezier = quick, 0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


#######################################################################################
# layouts
#######################################################################################

# ==============================
# dwindle
# ==============================

dwindle {
    pseudotile = true
    preserve_split = true
}

# ==============================
# master
# ==============================

master {
    new_status = master
}

#######################################################################################
# input
#######################################################################################

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = compose:ralt
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

#######################################################################################
# keybindings
#######################################################################################

# ==============================
# screenshots (grim + slurp + wl-copy)
# ==============================

# full screen to clipboard
bind = CTRL, F12, exec, grim - | wl-copy

# full screen to file
bind = CTRL_SHIFT, F12, exec, grim ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png

# select area and copy to clipboard
bind = SUPER, F12, exec, grim -g "$(slurp)" - | wl-copy

# select area and save to file
bind = SHIFT, F12, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png

# active window to clipboard
bind = CTRL_SUPER, F12, exec, sh -c "geom=\$(hyprctl activewindow -j | tr -d ' \n' | sed -E 's/.*\"at\":\\[(-?[0-9]+),(-?[0-9]+)\\].*\"size\":\\[([0-9]+),([0-9]+)\\].*/\\1,\\2 \\3x\\4/'); [ -n \"\$geom\" ] && grim -g \"\$geom\" - | wl-copy"

# active window to file
bind = SUPER_SHIFT, F12, exec, sh -c "geom=\$(hyprctl activewindow -j | tr -d ' \n' | sed -E 's/.*\"at\":\\[(-?[0-9]+),(-?[0-9]+)\\].*\"size\":\\[([0-9]+),([0-9]+)\\].*/\\1,\\2 \\3x\\4/'); [ -n \"\$geom\" ] && grim -g \"\$geom\" ~/Pictures/Screenshots/\$(date '+%Y-%m-%d_%H-%M-%S').png"

# ==============================
# application shortcuts
# ==============================

bind = $mainMod SHIFT, T, exec, $telegram
bind = $mainMod SHIFT, B, exec, $chromium
bind = $mainMod SHIFT, D, exec, $discord
bind = $mainMod SHIFT, S, exec, steam
bind = $mainMod SHIFT, K, exec, $keet
bind = $mainMod SHIFT, G, exec, gimp
bind = $mainMod SHIFT, I, exec, inkscape

# ==============================
# kill applications
# ==============================

bind = $mainMod CTRL, S, exec, killall steam
bind = $mainMod CTRL, D, exec, killall discord
bind = $mainMod CTRL, T, exec, killall telegram-desktop
bind = $mainMod CTRL, K, exec, killall pear-runtime keet

# ==============================
# window management
# ==============================

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen
bind = $mainMod, J, togglesplit,

# ==============================
# focus movement
# ==============================

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ==============================
# move windows
# ==============================

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ==============================
# workspaces
# ==============================

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ==============================
# mouse bindings
# ==============================

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================
# audio controls
# ==============================

bind = $mainMod SHIFT, M, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod SHIFT, Prior, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = $mainMod SHIFT, Next, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = $mainMod SHIFT, P, exec, xfce4-terminal -e pulsemixer

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ==============================
# brightness controls
# ==============================

bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# ==============================
# media controls
# ==============================

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

