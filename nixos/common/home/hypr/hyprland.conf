#######################################################################################
# HYPRLAND CONFIGURATION
# Reference: https://wiki.hyprland.org/Configuring/
#######################################################################################

autogenerated = 0  # Remove this line to remove the autogenerated warning
$mainMod = SUPER

# Janela de diálogo de arquivos
windowrulev2 = float, title:^(Open Files)$
windowrulev2 = center, title:^(Open Files)$
windowrulev2 = size 950 750, title:^(Open Files)$
windowrulev2 = minsize 800 600, title:^(Open Files)$

# Para todas as janelas de diálogo similares
windowrulev2 = float, title:^(Open Files|Save File|Select)$
windowrulev2 = center, title:^(Open Files|Save File|Select)$################
### MONITORS ###
################

monitor = DP-3, 1920x1080@144, 0x0, 1


xwayland {
  force_zero_scaling = true
}

###################
### APPLICATIONS ###
###################

$terminal = xfce4-terminal
$fileManager = thunar
$menu = rofi -show drun

#################
### AUTOSTART ###
#################

exec-once = hyprpaper &
exec-once = sleep 0.3 && waybar &
exec-once = sleep 0.5 && hyprctl reload
exec-once = thunar --daemon
exec-once = foot --server

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### PERMISSIONS #####
#####################

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#####################
### LOOK AND FEEL ###
#####################

general {
    col.active_border = 0xff89b4fa
    col.inactive_border = 0xff313244



    gaps_in = 6
    gaps_out = 6
    border_size = 2

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 6

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23,1,0.32,1
    bezier = easeInOutCubic, 0.65,0.05,0.36,1
    bezier = linear, 0,0,1,1
    bezier = almostLinear, 0.5,0.5,0.75,1.0
    bezier = quick, 0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = compose:ralt
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

# ==============================
# Screenshots (grim + slurp + wl-copy)
# ==============================

# Capture full screen to clipboard
bind = CTRL, F12, exec, grim - | wl-copy

# Capture full screen to file
bind = CTRL_SHIFT, F12, exec, grim ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png

# Select area and copy to clipboard
bind = SUPER, F12, exec, grim -g "$(slurp)" - | wl-copy

# Select area and save to file
bind = SHIFT, F12, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png

# Capture active window to clipboard
bind = CTRL_SUPER, F12, exec, sh -c "geom=\$(hyprctl activewindow -j | tr -d ' \n' | sed -E 's/.*\"at\":\\[(-?[0-9]+),(-?[0-9]+)\\].*\"size\":\\[([0-9]+),([0-9]+)\\].*/\\1,\\2 \\3x\\4/'); [ -n \"\$geom\" ] && grim -g \"\$geom\" - | wl-copy"

# Capture active window to file
bind = SUPER_SHIFT, F12, exec, sh -c "geom=\$(hyprctl activewindow -j | tr -d ' \n' | sed -E 's/.*\"at\":\\[(-?[0-9]+),(-?[0-9]+)\\].*\"size\":\\[([0-9]+),([0-9]+)\\].*/\\1,\\2 \\3x\\4/'); [ -n \"\$geom\" ] && grim -g \"\$geom\" ~/Pictures/Screenshots/\$(date '+%Y-%m-%d_%H-%M-%S').png"

# ==============================
# Application Shortcuts
# ==============================

$telegram = firejail --profile=$HOME/.config/firejail/telegram.profile telegram-desktop 
$chromium = firejail --profile=$HOME/.config/firejail/browser.profile chromium-browser %U
$discord = ELECTRON_OZONE_PLATFORM_HINT=wayland firejail --profile=/home/ratoncio/.config/firejail/browser.profile  Discord
$keet = ELECTRON_OZONE_PLATFORM_HINT=wayland firejail --profile=/home/ratoncio/.config/firejail/browser.profile keet 

bind = $mainMod Shift, T, exec, $telegram
bind = $mainMod Shift, B, exec, $chromium
bind = $mainMod Shift, D, exec, $discord
bind = $mainMod Shift, S, exec, steam
bind = $mainMod Shift, K, exec, $keet
bind = $mainMod Shift, G, exec, gimp
bind = $mainMod Shift, I, exec, inkscape

# ==============================
# Kill Applications
# ==============================

bind = $mainMod Ctrl, S, exec, killall steam
bind = $mainMod Ctrl, D, exec, killall Discord
bind = $mainMod Ctrl, T, exec, killall telegram-desktop
bind = $mainMod Ctrl, K, exec, killall pear-runtime keet

# ==============================
# Window Management
# ==============================

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, E, exit,
bind = $mainMod Shift, F, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen
bind = $mainMod, J, togglesplit,

# Focus Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll Through Workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move / Resize Windows with Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================
# Audio & Brightness
# ==============================


bind = $mainMod SHIFT, M, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod SHIFT, Prior, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = $mainMod SHIFT, Next, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = $mainMod SHIFT, P, exec, xfce4-terminal -e pulsemixer

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# ==============================
# Media Controls
# ==============================

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##########################
### WINDOW RULES #########
##########################

# Browsers
windowrulev2 = workspace 1, class:^(librewolf)$
windowrulev2 = workspace 1, class:^(chromium-browser)$

# Messengers
windowrulev2 = workspace 2, class:^(org.telegram.desktop)$
windowrulev2 = workspace 2, class:^(pear-runtime)$
windowrulev2 = workspace 2, class:^(forkgram)$
windowrulev2 = workspace 2, class:^(discord)$

# Code Editors
windowrulev2 = workspace 3, class:^(VSCodium)$

# PDF Readers
windowrulev2 = workspace 4, class:^(okular)$

# Image Editors
windowrulev2 = workspace 5, class:^(Gimp)$
windowrulev2 = workspace 5, class:^(krita)$
windowrulev2 = workspace 5, class:^(Inkscape)$

# Video Editors
windowrulev2 = workspace 6, class:^(org.kde.kdenlive)$

# Game Platforms
windowrulev2 = workspace 8, class:^(steamwebhelper)$
windowrulev2 = workspace 8, class:^(steam)$
windowrulev2 = workspace 8, class:^(heroic)$

# Specific Games
windowrulev2 = workspace 9, class:^(steam_app_0)$

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0


# XDG Desktop Portal (file pickers modernos)
windowrulev2 = center, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = size 60% 60%, class:^(xdg-desktop-portal-gtk)$

# KDE file picker
windowrulev2 = center, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$

# Diálogos GTK em geral
windowrulev2 = center, title:^(Open File)(.*)$
windowrulev2 = center, title:^(Select a File)(.*)$
windowrulev2 = center, title:^(Choose Files)(.*)$
windowrulev2 = center, title:^(Save As)(.*)$
windowrulev2 = center, title:^(Save File)(.*)$
windowrulev2 = center, title:^(Open Files)(.*)$
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Select a File)(.*)$
windowrulev2 = float, title:^(Choose Files)(.*)$
windowrulev2 = float, title:^(Save As)(.*)$

# File chooser genérico
windowrulev2 = center, title:^(file_chooser)$
windowrulev2 = float, title:^(file_chooser)$

# Nautilus (quando usado como file picker)
windowrulev2 = center, class:^(org.gnome.Nautilus)$, title:^(Open)(.*)$
windowrulev2 = float, class:^(org.gnome.Nautilus)$, title:^(Open)(.*)$

# Diálogos do Firefox
windowrulev2 = center, class:^(firefox)$, title:^(Opening)(.*)$
windowrulev2 = center, class:^(firefox)$, title:^(Enter name of file)(.*)$
windowrulev2 = float, class:^(firefox)$, title:^(Opening)(.*)$

# Diálogos do Chrome/Chromium
windowrulev2 = center, class:^(chromium)$, title:^(Open File)$
windowrulev2 = center, class:^(chrome)$, title:^(Open File)$
windowrulev2 = center, class:^(google-chrome)$, title:^(Open File)$

# Discord (aparentemente o que você está usando)
windowrulev2 = center, class:^(discord)$, title:^(Open Files)$
windowrulev2 = center, class:^(Discord)$, title:^(Open Files)$
windowrulev2 = float, class:^(discord)$, title:^(Open Files)$
windowrulev2 = float, class:^(Discord)$, title:^(Open Files)$

# Telegram
windowrulev2 = center, class:^(org.telegram.desktop)$, title:^(Choose)(.*)$
windowrulev2 = float, class:^(org.telegram.desktop)$, title:^(Choose)(.*)$

# Electron apps em geral
windowrulev2 = center, title:^(Open)$
windowrulev2 = float, title:^(Open)$

# Diálogos Qt
windowrulev2 = center, class:^(qt5ct)$
windowrulev2 = center, class:^(qt6ct)$

# ===================================
# Outras janelas flutuantes úteis
# ===================================

# Preferências e configurações
windowrulev2 = center, title:^(Preferences)$
windowrulev2 = center, title:^(Settings)$
windowrulev2 = float, title:^(Preferences)$
windowrulev2 = float, title:^(Settings)$

# Confirmações
windowrulev2 = center, title:^(Confirm)(.*)$
windowrulev2 = float, title:^(Confirm)(.*)$


# Thunar - Janela de Rename
windowrulev2 = center, class:^(thunar)$, title:^(Rename)(.*)$
windowrulev2 = float, class:^(thunar)$, title:^(Rename)(.*)$
windowrulev2 = size 10% 10%, class:^(thunar)$, title:^(Rename)(.*)$
windowrulev2 = pin, class:^(thunar)$, title:^(Rename)(.*)$

# Outras janelas de diálogo do Thunar
windowrulev2 = center, class:^(thunar)$, title:^(.*)(Properties)(.*)$
windowrulev2 = float, class:^(thunar)$, title:^(.*)(Properties)(.*)$
windowrulev2 = pin, class:^(thunar)$, title:^(.*)(Properties)(.*)$

windowrulev2 = center, class:^(thunar)$, title:^(Create)(.*)$
windowrulev2 = float, class:^(thunar)$, title:^(Create)(.*)$
windowrulev2 = pin, class:^(thunar)$, title:^(Create)(.*)$

windowrulev2 = center, class:^(thunar)$, title:^(Delete)(.*)$
windowrulev2 = float, class:^(thunar)$, title:^(Delete)(.*)$
windowrulev2 = pin, class:^(thunar)$, title:^(Delete)(.*)$

